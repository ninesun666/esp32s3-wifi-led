name: Android Release

# 推 v* 标签（如 v1.0.0）→ 构建签名 APK 并发布 GitHub Release；
# Actions 页面手动触发 → 只产出 Artifact，不发 Release。
#
# 首次使用需在仓库 Settings → Secrets and variables → Actions 添加：
#   ANDROID_KEYSTORE_BASE64  本地 android/keystore/release.jks 的 base64（macOS: base64 -i android/keystore/release.jks）
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD  取自本地 android/keystore.properties
# 未配置以上 secrets 也能构建，但产物是 debug 签名，无法覆盖安装正式版。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 配置签名密钥（有 secrets 时）
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 版本号取标签（v1.2.3 → 1.2.3）
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        working-directory: android
        run: |
          if [ -n "$APP_VERSION_NAME" ]; then
            gradle :app:assembleRelease -PappVersionName="$APP_VERSION_NAME"
          else
            gradle :app:assembleRelease
          fi

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: 发布到 GitHub Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
