<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="data:,">
<title>板子遥控</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#232b36;--fg:#e6edf3;--dim:#8b949e;--blue:#1f6feb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,"Microsoft YaHei",sans-serif;
padding:14px 14px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;background:#3a1414}
.dot{width:9px;height:9px;border-radius:50%;background:#f85149}
.pill.on{background:#10331f}.pill.on .dot{background:#3fb950;box-shadow:0 0 10px #3fb950}
.pill.warn{background:#3a2c10}.pill.warn .dot{background:#d29922}
.meta{color:var(--dim);font-size:13px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:13px;color:var(--dim);margin:0 0 10px;font-weight:600;letter-spacing:.02em}
button{font:inherit;color:var(--fg);background:#21262d;border:1px solid var(--line);border-radius:10px;
min-height:48px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sw{min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0}
.sw.active{outline:3px solid #fff;outline-offset:-3px}
input[type=range]{width:100%;height:44px}
.brirow{display:flex;align-items:center;gap:12px}
.brirow span{font-variant-numeric:tabular-nums;width:48px;text-align:right;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
background:#30363d;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;
opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
a{color:var(--blue)}
</style>
</head>
<body>
<div class="row">
  <div class="pill" id="pill"><span class="dot"></span><span id="st">连接中</span></div>
  <div class="meta" id="meta">-</div>
</div>

<section>
  <h2>灯带效果</h2>
  <div class="grid g4">
    <button class="fx" data-fx="solid">常亮</button>
    <button class="fx" data-fx="breathe">呼吸</button>
    <button class="fx" data-fx="rainbow">彩虹</button>
    <button class="fx" data-fx="off">熄灭</button>
  </div>
  <div class="grid g2" style="margin-top:8px">
    <button id="auto">恢复自动（跟随链路）</button>
    <button id="bars">屏幕三色条</button>
  </div>
</section>

<section>
  <h2>颜色</h2>
  <div class="grid g4" id="swatches"></div>
</section>

<section>
  <h2>亮度</h2>
  <div class="brirow"><input type="range" id="bri" min="0" max="100" value="50"><span id="briv">50%</span></div>
</section>

<section>
  <h2>屏上表情</h2>
  <div class="grid g3" id="emotes"></div>
</section>

<section>
  <h2>整屏纯色</h2>
  <div class="grid g3" id="screens"></div>
</section>

<p class="meta">板载完整页面（含 OTA、配网）：<a href="/">在这里</a> · 解锁：<a href="/unlock">/unlock</a></p>
<div id="toast"></div>

<script>
/* 协议与板子 web_index.h 的调用完全一致：/api/led 收 {manual,fx,rgb,brightness}
 * 并原样回状态，/api/screen 收 {emote} 或 {r,g,b} 或 {pattern:"bars"}。 */
var FX={solid:'常亮',breathe:'呼吸',rainbow:'彩虹',off:'熄灭'};
var EMOTES={happy:'开心',laughing:'大笑',loving:'喜欢',relaxed:'放松',sad:'难过',crying:'大哭',
angry:'生气',surprised:'惊讶',shocked:'震惊',thinking:'思考',confused:'困惑',sleepy:'犯困',
winking:'眨眼',neutral:'平静',idle:'待机'};
var SWATCH=['#ffffff','#ff5252','#ffa726','#ffee58','#66bb6a','#26c6da','#448aff','#d05ce3'];
var SCREENS=[['黑',0,0,0],['白',255,255,255],['红',224,40,40],['绿',40,200,40],['蓝',40,90,240],['黄',230,180,40]];
var led={manual:false,fx:'solid',rgb:[255,255,255],brightness:50};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';
clearTimeout(t._t);t._t=setTimeout(function(){t.className=''},2200)}
function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb2hex(a){return '#'+a.map(function(v){return ('0'+(v||0).toString(16)).slice(-2)}).join('')}

function paintUI(){
  document.querySelectorAll('.fx').forEach(function(b){
    b.className='fx'+(led.manual&&b.dataset.fx===led.fx?' active':'')});
  document.getElementById('auto').className=led.manual?'':'active';
  document.getElementById('bri').value=led.brightness;
  document.getElementById('briv').textContent=led.brightness+'%';
  document.querySelectorAll('.sw[data-rgb]').forEach(function(b){
    b.className='sw'+(rgb2hex(led.rgb)===b.dataset.rgb?' active':'')});
}

async function api(path,body){
  var opt={headers:{'Content-Type':'application/json'}};
  if(body){opt.method='POST';opt.body=JSON.stringify(body)}
  var r=await fetch(path,Object.assign({cache:'no-store'},opt));
  if(r.status===401){toast('未解锁：先去 /unlock 输入密钥');throw new Error('401')}
  var d=await r.json().catch(function(){return {}});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(d.error||''));
  return d;
}
async function postLed(){try{led=await api('/api/led',led);paintUI();toast('灯带已更新')}catch(e){toast('失败：'+e)}}
async function postScreen(b,label){try{await api('/api/screen',b);toast(label+' 已刷')}catch(e){toast('失败：'+e)}}

SWATCH.forEach(function(h){
  var b=document.createElement('button');b.className='sw';b.dataset.rgb=h;b.style.background=h;
  b.onclick=function(){led.rgb=hex2rgb(h);led.manual=true;paintUI();postLed()};
  document.getElementById('swatches').appendChild(b)});
Object.keys(EMOTES).forEach(function(n){
  var b=document.createElement('button');b.textContent=EMOTES[n];
  b.onclick=function(){postScreen({emote:n},EMOTES[n])};
  document.getElementById('emotes').appendChild(b)});
SCREENS.forEach(function(s){
  var b=document.createElement('button');b.textContent=s[0];
  b.onclick=function(){postScreen({r:s[1],g:s[2],b:s[3]},s[0])};
  document.getElementById('screens').appendChild(b)});
document.getElementById('bars').onclick=function(){postScreen({pattern:'bars'},'三色条')};
document.querySelectorAll('.fx').forEach(function(b){
  b.onclick=function(){led.fx=b.dataset.fx;led.manual=true;paintUI();postLed()}});
document.getElementById('auto').onclick=function(){led.manual=false;paintUI();postLed()};
document.getElementById('bri').addEventListener('input',function(){
  led.brightness=+this.value;document.getElementById('briv').textContent=this.value+'%'});
document.getElementById('bri').addEventListener('change',postLed);

async function tick(){
  try{
    var d=await api('/api/status');
    var m={online:['已联网','on'],linked:['仅连上路由','warn'],connecting:['连接中','']}[d.state]||['读不到',''];
    var p=document.getElementById('pill');p.className='pill '+m[1];
    document.getElementById('st').textContent=m[0];
    document.getElementById('meta').textContent=d.rssi+' dBm · 运行 '+Math.floor(d.uptime_s/60)+' 分';
  }catch(e){/* 解锁前不刷屏 */}
}
(async function(){try{led=await api('/api/led')}catch(e){}paintUI()})();
tick();setInterval(tick,3000);
</script>
</body>
</html>
