plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号跟随发布标签：CI 传 -PappVersionName=1.2.3（标签 v1.2.3 去前缀），本地缺省 1.0.0。
// versionCode 从三段版本号派生，保证每次发版单调递增（10000*major + 100*minor + patch）。
def appVersionName = (project.findProperty('appVersionName') ?: '1.0.0').toString()
def verParts = (appVersionName =~ /\d+/).findAll().collect { it as int }
while (verParts.size() < 3) { verParts << 0 }
def appVersionCode = verParts[0] * 10000 + verParts[1] * 100 + verParts[2]

// App 内"检查更新"的数据源；本地测试可传 -PupdateApiBase=http://... 指向假服务器。
def updateApiBase = (project.findProperty('updateApiBase') ?: 'https://api.github.com').toString()
def updateRepo = (project.findProperty('updateRepo') ?: 'ninesun666/esp32s3-wifi-led').toString()

// 正式签名：本地读 android/keystore.properties（已 gitignore），CI 由工作流用 secrets 生成同名文件。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseSigning = keystorePropsFile.exists()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.ninesun666.espled'
    compileSdk 34

    defaultConfig {
        applicationId "com.ninesun666.espled"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "String", "UPDATE_API_BASE", "\"${updateApiBase}\""
        buildConfigField "String", "UPDATE_REPO", "\"${updateRepo}\""
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 没有密钥时退回 debug 签名，保证 clone 下来直接能出包（但不能覆盖安装正式版）。
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Nordic Semiconductor Android-BLE-Library (Apache-2.0), structure follows
    // the official Blinky sample: BleManager subclass + ConnectionObserver.
    implementation 'no.nordicsemi.android:ble-ktx:2.10.2'
}
